<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foto İmaj</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{color-scheme:light;--bg:#f3f4f6;--panel:#ffffff;--panel2:#f0f2f5;--line:#e1e4e9;--text:#14161b;--dim:#6b7280;--red:#7a1f3d;--red2:#9b2c4f;--yel:#c9a46a;--rail:54px;}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
button,input,select,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;}
[hidden]{display:none !important;}
#app{height:100%;display:flex;flex-direction:column;}
#top{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px;background:#ffffff;border-bottom:1px solid var(--line);}
#top b{font-size:15px;margin:0 4px;white-space:nowrap;}
.tb{min-width:42px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:800;font-size:15px;padding:0 10px;}
.tb:disabled{opacity:.35;}
.tb.pri{background:var(--red);border-color:var(--red);color:#fff;font-size:13.5px;}
#top .sp{flex:1;}
#work{flex:1;min-height:0;display:grid;grid-template-columns:var(--rail) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"rail stage" "rail panel";}
#rail{grid-area:rail;overflow-y:auto;background:#ffffff;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:4px 0 calc(6px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch;scrollbar-width:none;}
#rail::-webkit-scrollbar{display:none;}
.rb{flex:0 0 auto;border:0;background:none;color:var(--dim);padding:7px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;font-weight:700;letter-spacing:.2px;position:relative;}
.rb i{font-style:normal;font-size:20px;line-height:1;}
.rb[aria-pressed="true"]{color:var(--text);background:#f3f4f6;}
.rb[aria-pressed="true"]::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--yel);}
#stage{grid-area:stage;position:relative;min-height:0;min-width:0;background:#e6e8ed;overflow:hidden;display:flex;align-items:center;justify-content:center;}
#cv{display:block;touch-action:none;border-radius:2px;box-shadow:0 6px 30px rgba(0,0,0,.6);background:#000;}
#quick{position:absolute;left:6px;right:6px;bottom:8px;display:flex;gap:6px;overflow-x:auto;justify-content:flex-start;scrollbar-width:none;pointer-events:none;}
#quick button:first-child{margin-left:auto;}#quick button:last-child{margin-right:auto;}
#quick::-webkit-scrollbar{display:none;}
#quick button{color:#fff;pointer-events:auto;flex:0 0 auto;height:42px;padding:0 12px;border-radius:21px;border:1px solid rgba(255,255,255,.28);background:rgba(15,16,20,.9);font-weight:800;font-size:13px;white-space:nowrap;}
.zp{color:#fff;pointer-events:auto;flex:0 0 auto;display:flex;align-items:center;gap:6px;height:42px;padding:0 12px;border-radius:21px;border:1px solid rgba(255,255,255,.28);background:rgba(15,16,20,.9);font-size:14px;}
.zp{padding:0 8px;gap:4px;}.zp input{width:78px;height:30px;}
#quick button.del{background:rgba(192,57,43,.95);border-color:#9b2c4f;}
#quick button[aria-pressed="true"]{background:var(--yel);color:#111;border-color:var(--yel);}
#panel{grid-area:panel;background:var(--panel);border-top:2px solid var(--yel);overflow:hidden;height:0;display:flex;flex-direction:column;min-width:0;}
#panel.open{height:min(46vh,400px);}
.phead{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);}
.phead b{flex:1;font-size:14.5px;}
.phead button{height:34px;min-width:34px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-weight:800;}
#pbody{flex:1;min-height:0;overflow-y:auto;padding:10px 12px calc(14px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch;}
@media (min-width:820px){
  #work{grid-template-columns:var(--rail) auto minmax(0,1fr);grid-template-rows:minmax(0,1fr);grid-template-areas:"rail panel stage";}
  #panel{height:auto;width:0;border-top:0;border-right:1px solid var(--line);}
  #panel.open{height:auto;width:310px;}
}
.lab{display:block;font-size:12px;color:var(--dim);font-weight:700;margin:12px 0 5px;}
.lab:first-child{margin-top:0;}
.hint{color:var(--dim);font-size:12px;margin:6px 0 0;}
.grid{display:grid;gap:8px;grid-template-columns:repeat(4,1fr);}
.grid.g3{grid-template-columns:repeat(3,1fr);}
.grid.g2{grid-template-columns:repeat(2,1fr);}
.gb{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:6px 4px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;color:var(--text);overflow:hidden;}
.gb canvas,.gb svg{display:block;max-width:100%;}
.gb[aria-pressed="true"]{border-color:#e0cf00;background:#fff8c9;}
.gb.txt{min-height:52px;font-size:21px;line-height:1.1;}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.seg button{flex:1;border:0;background:var(--panel2);color:var(--dim);font-weight:700;font-size:12.5px;padding:9px 4px;min-height:40px;}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff;}
.sws{display:flex;flex-wrap:wrap;gap:7px;}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0;position:relative;display:inline-flex;align-items:center;justify-content:center;font-size:15px;background:var(--panel2);}
.sw[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--red);}
.sw.cu input{position:absolute;inset:0;opacity:0;width:100%;height:100%;}
.rg{display:flex;align-items:center;gap:8px;margin-top:4px;}
.rg span{min-width:34px;text-align:right;font-size:12px;color:var(--dim);}
input[type=range]{flex:1;accent-color:var(--red);height:30px;}
.inp,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;font-size:15px;padding:9px 11px;min-height:42px;}
textarea{resize:none;min-height:64px;}
.btn{border:0;border-radius:11px;background:var(--red);color:#fff;font-weight:800;font-size:14.5px;padding:12px;min-height:46px;width:100%;margin-top:8px;}
.btn.g{background:var(--panel2);border:1px solid var(--line);color:var(--text);font-weight:700;}
.btn.sm{min-height:38px;font-size:13px;padding:8px;margin-top:0;}
.row{display:flex;gap:8px;}
.row>*{flex:1;}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:18px;padding:7px 12px;font-size:12.5px;font-weight:700;}
.chip[aria-pressed="true"]{background:var(--yel);color:#111;border-color:var(--yel);}
.lrow{display:flex;gap:6px;margin-bottom:6px;align-items:stretch;}
.lrow .ln{flex:1;text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:9px;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:40px;}
.lrow[data-s="1"] .ln{border-color:#e0cf00;background:#fff8c9;}
.lrow button.sb{width:40px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;font-size:14px;}
#sheet{position:fixed;inset:0;z-index:50;background:rgba(20,22,27,.6);display:flex;align-items:flex-end;justify-content:center;}
#sheet .in{width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:var(--panel);border-radius:18px 18px 0 0;border-top:3px solid var(--yel);padding:14px 14px calc(18px + env(safe-area-inset-bottom,0px));}
#sheet h3{margin:0 0 6px;font-size:16px;}
#outImg{width:100%;border-radius:10px;margin-top:10px;display:none;}
#outV{width:100%;border-radius:10px;margin-top:10px;background:#000;}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:#222;border:1px solid var(--line);color:#fff;padding:10px 14px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:88%;text-align:center;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
#intro{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(236,238,242,.78);backdrop-filter:blur(2px);}
#intro .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:340px;text-align:center;}
#intro h2{margin:0 0 6px;font-size:18px;}
#intro p{margin:0 0 10px;color:var(--dim);font-size:13px;}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="tb" id="bUndo" aria-label="Geri al" disabled>↶</button>
    <button class="tb" id="bRedo" aria-label="İleri al" disabled>↷</button>
    <b>Foto İmaj</b>
    <span class="sp"></span>
    <button class="tb pri" id="bSave">⤓ Kaydet</button>
  </div>
  <div id="work">
    <nav id="rail" aria-label="Araçlar"></nav>
    <div id="stage">
      <canvas id="cv" width="540" height="675" aria-label="Tasarım alanı"></canvas>
      <div id="quick" hidden></div>
      <div id="intro">
        <div class="box">
          <h2>Boş tuval hazır</h2>
          <p>Soldaki menüden yazı, şekil, ikon ve fotoğraf ekle. Dokun, sürükle, büyüt.</p>
          <button class="btn" id="iPhoto">📷 Fotoğraf ekle</button>
          <button class="btn g" id="iText">🔤 Yazıyla başla</button>
          <button class="btn g" id="iClose">Boş başla</button>
        </div>
      </div>
    </div>
    <section id="panel" aria-label="Ayarlar">
      <div class="phead"><b id="ptitle"></b><button id="pclose" aria-label="Kapat">▼</button></div>
      <div id="pbody"></div>
    </section>
  </div>
</div>
<input type="file" id="fIn" accept="image/*" hidden>
<input type="file" id="mIn" accept="audio/*" hidden>
<div id="sheet" hidden></div>
<div class="toast" id="toast"></div>

function pushLayer(fn){ LY.push(fn); try{ history.pushState({fi:LY.length},""); }catch(e){} }
function closeTopUI(then){ if(!LY.length){ then&&then(); return; } afterPop=then||null; try{ history.back(); }catch(e){ var f=LY.pop(); f(); } }
window.addEventListener("popstate",function(){
  if(LY.length){ var f=LY.pop(); f(); if(afterPop){ var a=afterPop; afterPop=null; a(); } return; }
  var now=Date.now();
  if(now-lastBack<2200){ return; }
  lastBack=now; toast("Çıkmak için tekrar geri bas"); try{ history.pushState({fg:1},""); }catch(e){}
});
try{ history.replaceState({fb:1},""); history.pushState({fg:1},""); }catch(e){}

function onSelChange(){ buildQuick(); refreshPanel(); redraw(); }
function buildQuick(){
  var q=$("#quick"), o=selObj();
  if(!o){ q.hidden=true; q.innerHTML=""; return; }
  var h='<button class="del" data-q="sil">🗑 Sil</button><button data-q="cog">⧉ Çoğalt</button>';
  if(o.t==="text") h+='<button data-q="duz">✏️ Yaz</button>';
  if(o.t==="photo"){ h+='<button data-q="degis">🔁 Değiştir</button>'; if(o.src) h+='<button data-q="kay" aria-pressed="'+(E.pan?"true":"false")+'">✋ Kaydır</button>'; }
  h+='<button data-q="one">↑ Öne</button><button data-q="arka">↓ Arkaya</button>';
  q.innerHTML=h; q.hidden=false; q.style.top="6px"; q.style.bottom="auto";
}
$("#quick").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return; var o=selObj(), a=b.getAttribute("data-q"); if(!o) return;
  if(a==="sil") delSel(); else if(a==="cog") dupSel(); else if(a==="duz") editText(); else if(a==="degis") pickPhotoFor(o);
  else if(a==="kay"){ E.pan=!E.pan; buildQuick(); toast(E.pan?"Fotoğrafı çerçevenin içinde kaydır":"Nesneyi taşıma modu"); }
  else if(a==="one") order(o,1); else if(a==="arka") order(o,-1);
});
function delSel(){ var o=selObj(); if(!o) return; E.objs=E.objs.filter(function(x){ return x.id!==o.id; }); E.sel=null; pushH(); onSelChange(); }
function dupSel(){ var o=selObj(); if(!o) return; var c=JSON.parse(JSON.stringify(o,function(k,v){ return k.charAt(0)==="_"?undefined:v; })); c.id=++E.uid; c.x+=40; c.y+=40; c.name=(o.name||"")+" kopya"; E.objs.push(c); if(c.t==="text") txLayout(c); E.sel=c.id; pushH(); onSelChange(); }
function order(o,d){ var i=E.objs.indexOf(o), j=clamp(i+d,0,E.objs.length-1); if(i===j) return; E.objs.splice(i,1); E.objs.splice(j,0,o); pushH(); redraw(); refreshPanel(); }
function add(o){ E.objs.push(o); hideIntro(); E.sel=o.id; E.pan=false; pushH(); onSelChange(); }

/* ---------- Fotoğraf yükleme ---------- */
var pendingPhoto=null;
function pickPhotoFor(o){ pendingPhoto=o||null; var f=$("#fIn"); f.value=""; f.click(); }
$("#fIn").addEventListener("change",function(){
  var f=this.files&&this.files[0]; if(!f) return;
  var url=URL.createObjectURL(f), im=new Image();
  im.onload=function(){
    var mx=2400, sc=Math.min(1,mx/Math.max(im.naturalWidth,im.naturalHeight)), c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(im.naturalWidth*sc)); c.height=Math.max(1,Math.round(im.naturalHeight*sc));
    c.getContext("2d").drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(url);
    var id=++E.imgSeq; IM[id]=c; var o=pendingPhoto; pendingPhoto=null;
    if(o&&byId(o.id)){ o.src=id; o.ox=0; o.oy=0; o.zoom=1; o._pc=null; if(o.frame==="yok"&&!o.kl){ fitPhotoBox(o,c); } pushH(); onSelChange(); }
    else { var p=mkPhoto({src:id}); fitPhotoBox(p,c); add(p); }
  };
  im.onerror=function(){ toast("Bu fotoğraf açılamadı. JPG veya PNG dene."); URL.revokeObjectURL(url); };
  im.src=url;
});
function fitPhotoBox(o,c){ var mw=E.W*0.86, mh=E.H*0.7, s=Math.min(mw/c.width,mh/c.height); o.w=Math.round(c.width*s); o.h=Math.round(c.height*s); }
function fitFrame(o,fr){
  var sz=FRAME_SIZE[fr]; if(!sz){ return; } var s=Math.min(E.W*0.82/sz[0],E.H*0.7/sz[1]); o.w=Math.round(sz[0]*s); o.h=Math.round(sz[1]*s);
}

function decodeAB(ac,ab){ return new Promise(function(res,rej){ var p=ac.decodeAudioData(ab,res,rej); if(p&&p.then) p.then(res,rej); }); }
async function makeVideo(){
  if(E.busy) return;
  var mime=pickMimeF();
  var q=720/Math.min(E.W,E.H), c2=document.createElement("canvas"); c2.width=Math.round(E.W*q/2)*2; c2.height=Math.round(E.H*q/2)*2; q=c2.width/E.W;
  if(mime===null||!c2.captureStream){ toast("Bu tarayıcı video kaydını desteklemiyor."); return; }
  E.sel=null; buildQuick(); redraw();
  var dur=V.dur, stream=c2.captureStream(30), ac=null, srcN=null, gain=null, note="";
  openSheet('<h3>Video hazırlanıyor</h3><div id="vwrap"></div><p class="hint" id="vst">Başlıyor...</p><button class="btn g" data-sa="cancel">Vazgeç</button>');
  c2.style.cssText="width:100%;max-height:50vh;object-fit:contain;border-radius:10px;background:#000"; $("#vwrap").appendChild(c2);
  E.busy=true; var cancelled=false; E.cancel=function(){ cancelled=true; };
  if(V.music!=="yok"){
    try{
      var AC=window.AudioContext||window.webkitAudioContext; ac=new AC(); if(ac.resume) ac.resume();
      var ab;
      if(V.music!=="own"){ var tk=LIB.filter(function(x){ return x.id===V.music; })[0]; if(!tk) throw new Error("yok"); if(!V.buf[tk.id]){ var r=await fetch(tk.src); V.buf[tk.id]=await r.arrayBuffer(); } ab=V.buf[tk.id].slice(0); }
      else { if(!V.own) throw new Error("dosya yok"); ab=V.own.slice(0); }
      var buf=await decodeAB(ac,ab), dest=ac.createMediaStreamDestination();
      srcN=ac.createBufferSource(); srcN.buffer=buf; srcN.loop=true; gain=ac.createGain(); gain.gain.value=V.vol; srcN.connect(gain); gain.connect(dest);
      var tr=dest.stream.getAudioTracks()[0]; if(tr) stream.addTrack(tr);
    }catch(e){ note=" (müzik eklenemedi, sessiz devam)"; srcN=null; if(ac){ try{ ac.close(); }catch(_){} ac=null; } }
  }
  var chunks=[], rec;
  try{ rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:4500000}:{videoBitsPerSecond:4500000}); }catch(e){ E.busy=false; toast("Video kaydı başlatılamadı."); closeTopUI(); return; }
  rec.ondataavailable=function(ev){ if(ev.data&&ev.data.size) chunks.push(ev.data); };
  var stopped=new Promise(function(r){ rec.onstop=r; });
  E.anim={t:0,dur:dur,fx:V.fx,kb:V.kb}; renderTo(c2,q,true);
  rec.start(500); if(srcN){ srcN.start(0); var t1=ac.currentTime; gain.gain.setValueAtTime(V.vol,t1+Math.max(0,dur-1.2)); gain.gain.linearRampToValueAtTime(0.0001,t1+dur); }
  var t0=performance.now();
  await new Promise(function(res){
    (function frame(){
      var t=(performance.now()-t0)/1000;
      if(t>=dur||cancelled){ res(); return; }
      E.anim.t=t; renderTo(c2,q,true);
      var st=$("#vst"); if(st) st.textContent="Video hazırlanıyor... "+Math.min(dur,Math.round(t))+" / "+dur+" sn"+note;
      requestAnimationFrame(frame);
    })();
  });
  try{ if(rec.state!=="inactive") rec.stop(); }catch(e){} await stopped;
  try{ if(srcN) srcN.stop(); if(ac) ac.close(); }catch(e){}
  E.anim=null; E.busy=false; E.cancel=null; redraw();
  if(cancelled) return;
  var type=(rec.mimeType||mime||"video/webm").split(";")[0], ext=type.indexOf("mp4")>=0?"mp4":"webm", blob=new Blob(chunks,{type:type}), url=URL.createObjectURL(blob);
  E.vblob=blob; E.vext=ext; E.vtype=type; window.__videoSon={size:blob.size,type:type,audio:!!srcN};
  if(sheet.hidden) return;
  sheet.querySelector(".in").innerHTML='<h3>Video hazır</h3><video id="outV" src="'+url+'" controls playsinline style="width:100%;max-height:52vh;border-radius:10px;background:#000"></video><button class="btn" data-sa="vdl">⤓ İndir</button>'+(canShareFiles()?'<button class="btn g" data-sa="vshare">↗ Paylaş</button>':'')+'<button class="btn g" data-sa="close">Kapat</button><p class="hint">'+(blob.size/1048576).toFixed(1)+' MB · '+ext.toUpperCase()+(srcN?" · müzikli":"")+note+'</p>';
}

/* ---- Projelerim (tarayıcıda saklanır) ---- */
function idb(){ return new Promise(function(res,rej){ if(!window.indexedDB){ rej(new Error("yok")); return; } var r=indexedDB.open("fotoimaj",1); r.onupgradeneeded=function(){ var d=r.result; if(!d.objectStoreNames.contains("p")) d.createObjectStore("p",{keyPath:"id"}); if(!d.objectStoreNames.contains("m")) d.createObjectStore("m",{keyPath:"id"}); }; r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; }); }
function pjTx(stores,mode,fn){ return idb().then(function(db){ return new Promise(function(res,rej){ var t=db.transaction(stores,mode), out=fn(t); t.oncomplete=function(){ res(out&&out.result!==undefined?out.result:out); }; t.onerror=t.onabort=function(){ rej(t.error); }; }); }); }
function blobOf(cv){ return new Promise(function(res){ cv.toBlob(res,"image/jpeg",0.9); }); }
async function saveProject(asNew){
  if(!E.objs.length){ toast("Önce bir şeyler ekle"); return; }
  try{
    var ids={}; E.objs.forEach(function(o){ if(o.t==="photo"&&o.src&&IM[o.src]) ids[o.src]=1; });
    var imgs={}; for(var k in ids){ imgs[k]=await blobOf(IM[k]); }
    var th=document.createElement("canvas"), was=E.sel; E.sel=null; renderTo(th,260/E.W,true); E.sel=was; var thumb=th.toDataURL("image/jpeg",0.7);
    var d=new Date(), nm=(E.pname&&!asNew&&E.pid)?E.pname:("Tasarım "+d.toLocaleDateString("tr-TR")+" "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2));
    var id=(asNew||!E.pid)?("p"+Date.now()):E.pid, sn=snap(), seq=E.imgSeq;
    await pjTx(["p","m"],"readwrite",function(t){ t.objectStore("p").put({id:id,snap:sn,imgs:imgs,seq:seq}); t.objectStore("m").put({id:id,name:nm,thumb:thumb,t:Date.now()}); });
    E.pid=id; E.pname=nm; toast("Kaydedildi: "+nm); if(E.tool==="proje") loadProjects();
  }catch(e){ toast("Kaydedilemedi. Tarayıcı yer ya da izin vermiyor olabilir."); }
}
function blobToCanvas(bl){ return new Promise(function(res,rej){ var u=URL.createObjectURL(bl), im=new Image(); im.onload=function(){ var c=document.createElement("canvas"); c.width=im.naturalWidth; c.height=im.naturalHeight; c.getContext("2d").drawImage(im,0,0); URL.revokeObjectURL(u); res(c); }; im.onerror=function(){ rej(new Error("img")); }; im.src=u; }); }
async function openProject(id){
  try{
    var rec=await pjTx(["p"],"readonly",function(t){ return t.objectStore("p").get(id); });
    if(!rec){ toast("Proje bulunamadı"); return; }
    for(var k in IM) delete IM[k];
    for(var k2 in rec.imgs){ IM[k2]=await blobToCanvas(rec.imgs[k2]); }
    E.imgSeq=Math.max(rec.seq||0,E.imgSeq); restore(rec.snap); E.hist=[]; E.hi=-1; E.sel=null; E.pid=id;
    var m=await pjTx(["m"],"readonly",function(t){ return t.objectStore("m").get(id); }); E.pname=m?m.name:"";
    pushH(); hideIntro(); fit(); onSelChange(); toast("Açıldı");
  }catch(e){ toast("Proje açılamadı"); }
}
async function loadProjects(){
  var box=$("#pjList"); if(!box) return;
  try{
    var list=await pjTx(["m"],"readonly",function(t){ return t.objectStore("m").getAll(); }); box=$("#pjList"); if(!box) return;
    list=(list||[]).sort(function(a,b){ return b.t-a.t; });
    if(!list.length){ box.innerHTML='<p class="hint">Henüz kayıtlı tasarım yok.</p>'; return; }
    box.innerHTML=list.map(function(m){ return '<div class="lrow" data-s="'+(E.pid===m.id?1:0)+'"><img src="'+m.thumb+'" alt="" style="width:44px;height:55px;object-fit:cover;border-radius:6px;background:#000"><button class="ln" data-a="pjopen" data-v="'+m.id+'">'+esc(m.name)+'</button><button class="sb" data-a="pjdel" data-v="'+m.id+'" aria-label="Sil">🗑</button></div>'; }).join("");
  }catch(e){ if(box) box.innerHTML='<p class="hint">Bu tarayıcıda kayıt kullanılamıyor (gizli sekme olabilir).</p>'; }
}

ACT.pjdel=function(v){ if(!confirm("Bu tasarım silinsin mi?")) return; pjTx(["p","m"],"readwrite",function(t){ t.objectStore("p").delete(v); t.objectStore("m").delete(v); }).then(function(){ if(E.pid===v){ E.pid=null; E.pname=""; } loadProjects(); }).catch(function(){ toast("Silinemedi"); }); };
ACT.pjnew=function(){ if(E.objs.length&&!confirm("Açık tasarım kapanacak. Kaydetmediysen kaybolur. Devam edilsin mi?")) return; E.objs=[]; E.sel=null; E.pid=null; E.pname=""; for(var k in IM) delete IM[k]; E.hist=[]; E.hi=-1; pushH(); onSelChange(); toast("Boş tuval"); };

/* ---- Kırp modu ---- */
function enterCrop(o){
  if(!o||!o.src||E.crop) return; E.crop=o.id; E.pan=false; E.sel=o.id;
  pushLayer(function(){ E.crop=null; pushH(); buildQuick(); redraw(); });
  buildQuick(); redraw(); toast("Parmağınla fotoğrafı sürükle, iki parmakla büyüt");
}
function buildQuick(){
  var q=$("#quick"), o=selObj();
  if(E.crop&&o){
    q.innerHTML='<span class="zp">🔍<input type="range" id="cz" min="100" max="600" step="5" value="'+Math.round((o.zoom||1)*100)+'" aria-label="Yakınlaştır"></span><button data-q="cortala">⌖ Ortala</button><button data-q="ctamam" aria-pressed="true">✓ Tamam</button>';
    q.hidden=false; q.style.top="6px"; q.style.bottom="auto"; return;
  }
  if(!o){ q.hidden=true; q.innerHTML=""; return; }
  var h='<button class="del" data-q="sil">🗑 Sil</button><button data-q="cog">⧉ Çoğalt</button>';
  if(o.t==="text") h+='<button data-q="duz">✏️ Yaz</button>';
  if(o.t==="photo"){ h+='<button data-q="degis">🔁 Değiştir</button>'; if(o.src) h+='<button data-q="crop">✂ Kırp</button>'; if(o.src&&!o.kl) h+='<button data-q="kay" aria-pressed="'+(E.pan?"true":"false")+'">✋ Kaydır</button>'; }
  h+='<button data-q="one">↑ Öne</button><button data-q="arka">↓ Arkaya</button>';
  q.innerHTML=h; q.hidden=false; q.style.top="6px"; q.style.bottom="auto";
}
$("#quick").addEventListener("click",function(e){
  var b=e.target.closest("button"); if(!b) return; var a=b.getAttribute("data-q"), o=selObj();
  if(a==="crop"&&o) enterCrop(o);
  else if(a==="cortala"&&o){ o.ox=0; o.oy=0; redraw(); }
  else if(a==="ctamam") closeTopUI();
});
$("#quick").addEventListener("input",function(e){
  if(e.target.id!=="cz") return; var o=selObj(); if(!o) return; o.zoom=clamp(+e.target.value/100,1,6); redraw();
});
var wheelT=null;
cv.addEventListener("wheel",function(e){
  var o=selObj(); if(!o||o.t!=="photo"||!o.src||!(E.crop||E.pan||o.kl)) return;
  e.preventDefault(); o.zoom=clamp((o.zoom||1)*Math.exp(-e.deltaY*0.0015),1,6); var z=document.getElementById("cz"); if(z) z.value=Math.round(o.zoom*100);
  redraw(); clearTimeout(wheelT); wheelT=setTimeout(pushH,500);
},{passive:false});

pushH(); markRail(); updUR();
loadFonts(function(){ fit(); });
fit();
